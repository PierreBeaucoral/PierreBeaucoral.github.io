{{- /* Base template — overrides the Hugo Blox module. */ -}}
<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "site-header.html" . }}
  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "site-footer.html" . }}
  <script>
    // Header shadow on scroll
    (function () {
      var h = document.querySelector('.site-header');
      if (!h) return;
      var onScroll = function () { h.classList.toggle('scrolled', window.scrollY > 24); };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
    // Copy-email buttons. The label swap is silent to screen readers, so the
    // result is also written to an aria-live region next to the button.
    document.querySelectorAll('[data-copy]').forEach(function (b) {
      var live = b.parentNode.querySelector('[data-copy-status]');
      b.addEventListener('click', function () {
        try { navigator.clipboard.writeText(b.getAttribute('data-copy')); } catch (e) {}
        var t = b.textContent; b.textContent = 'Copied \u2713';
        if (live) { live.textContent = 'Email address copied to clipboard'; }
        setTimeout(function () {
          b.textContent = t;
          if (live) { live.textContent = ''; }
        }, 1800);
      });
    });
  </script>
</body>
</html>
