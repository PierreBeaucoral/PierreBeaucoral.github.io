# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
#
# NOTE: this block is inert. It configures the HugoBlox theme, which
# layouts/_default/baseof.html and layouts/partials/head.html bypass
# entirely — the site is styled by static/css/site.css alone. In
# particular `theme_night: dark` never produced a dark mode; the custom
# stylesheet defines a single light palette. Left here (commented) so the
# next person does not spend an afternoon wondering why it does nothing.
#
# appearance:
#   theme_day: rose
#   theme_night: dark
#   font: classic
#   font_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'CERDI — Université Clermont Auvergne, CNRS, IRD'
    description: 'Pierre Beaucoral — PhD candidate in development and environmental economics at CERDI. Research on climate finance, geocoded development aid, ML/NLP, and causal inference.'
    twitter: 'PBeaucoral'
    # Default Open Graph / Twitter share image (lives in assets/media/)
    share:
      image: 'hero-academic.png'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
    # Privacy-respecting alternative. Uncomment and set your Plausible domain
    # after registering at https://plausible.io (or self-hosting).
    # plausible: 'pierrebeaucoral.github.io'
  verification:
    google: ''
    baidu: ''
    bing: ''

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {year} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: ''
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Security

security:
  # Allow frame for embedding speaker notes in slides
  allow_frame: true

icon.pack:
  ai : true  # Academicons icon pack https://jpswalsh.github.io/academicons/

# Carbon footprint
# Shown as a disclaimer line in the site footer. The figures come from
# https://www.websitecarbon.com/ — re-test the homepage after any change that
# alters page weight (fonts, images, scripts), then update `grams`, `rating`
# and `tested` below so the footer never states a stale number.
carbon:
  grams: '0.034'
  rating: 'A+'
  tested: '8 September 2026'
  # Report page for this site; only exists for URLs that have been tested.
  #
  # NOTE: Website Carbon caches a result per URL for the day it was tested, so
  # the bare-domain report still shows the pre-optimisation figure (0.057 g, A)
  # from the test run earlier on 8 Sep 2026. The `/index.html` report below is
  # the same page re-tested after the font work landed, and is what `grams` and
  # `rating` above quote. Once the bare-domain URL re-tests, submit
  # https://pierrebeaucoral.github.io/ at https://www.websitecarbon.com/ and
  # switch this back to the tidier slug:
  #   https://www.websitecarbon.com/website/pierrebeaucoral-github-io/
  report: 'https://www.websitecarbon.com/website/pierrebeaucoral-github-io-index-html/'
  # Calculator homepage, so a reader can test any page they like.
  calculator: 'https://www.websitecarbon.com/'
